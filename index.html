<script>
// AI Chat using OpenAI API (free/demo version)
async function chat() {
  const input = document.getElementById('userInput').value.trim();
  const response = document.getElementById('chatResponse');
  
  if(!input) {
    response.textContent = "Please type a question.";
    return;
  }

  response.textContent = "Thinking...";

  try {
    const res = await fetch("https://api.openai.com/v1/chat/completions", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer YOUR_OPENAI_API_KEY"
      },
      body: JSON.stringify({
        model: "gpt-3.5-turbo",
        messages: [{role: "user", content: input}],
        temperature: 0.7,
        max_tokens: 150
      })
    });

    const data = await res.json();
    response.textContent = data.choices[0].message.content;
  } catch (err) {
    response.textContent = "Sorry, something went wrong. Please try again later.";
    console.error(err);
  }

  document.getElementById('userInput').value = "";
}
</script>
